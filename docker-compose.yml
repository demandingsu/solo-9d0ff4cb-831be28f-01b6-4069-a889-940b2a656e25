services:
  coldstore:
    build: .
    image: coldstore-ab:latest
    ports:
      - "8000:8000"
    environment:
      COLDSTORE_DB: /data/coldstore.sqlite3
      COLDSTORE_SECRET: change-me-in-production
    volumes:
      - coldstore-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  coldstore-data:
